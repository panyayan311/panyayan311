name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # 毎日 9:00 (JST)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-monokai.svg?color_snake=#f92672&color_dots=#3e3d32,#4e6a1f,#6f9a24,#8fc228,#a6e22e&color_dot_border=#272822&color_background=#272822

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
